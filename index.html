<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StressSense AI — Student Wellness Check-In</title>
<meta name="description" content="A student-friendly facial expression wellness check-in tool. Reflect on your stress levels, track your mood, and discover relaxation techniques."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"/>
<meta name="theme-color" content="#f5f1ea"/>
<style>
:root{--bg:#f5f1ea;--surface:#fff;--surface2:#faf7f1;--ink:#1d2b28;--ink2:#53625e;--ink3:#7b8985;--line:rgba(29,43,40,.10);--line2:rgba(29,43,40,.2);--brand:#0f766e;--brand2:#14938a;--coral:#d4512d;--sea:#2b7fa8;--ok:#2f8a52;--warn:#b97800;--bad:#d9453d;--r:18px;--sh:0 1px 2px rgba(29,43,40,.05),0 10px 26px -10px rgba(29,43,40,.14);--shl:0 2px 4px rgba(29,43,40,.06),0 20px 40px -14px rgba(29,43,40,.22);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(900px 500px at 100% -10%,rgba(232,102,74,.10),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(15,118,110,.10),transparent 60%);background-attachment:fixed;color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
button:focus-visible,.oc:focus-visible,.emo:focus-visible,.ss:focus-visible{outline:3px solid rgba(15,118,110,.35);outline-offset:2px}
#app{display:flex;flex-direction:column;min-height:100vh}
.ml{display:flex;flex:1}
.pc{flex:1;padding:36px 40px;max-width:1120px;margin:0 auto;width:100%}
/* navbar */
.nb{height:68px;background:rgba(255,255,255,.78);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(14px) saturate(1.4)}
.nb-brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.nb-logo{width:40px;height:40px;background:linear-gradient(135deg,#0f766e,#e8664a);border-radius:14px 14px 14px 4px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 14px -4px rgba(15,118,110,.5);transition:transform .3s var(--ease)}
.nb-brand:hover .nb-logo{transform:rotate(-6deg) scale(1.06)}
.nb-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--ink);line-height:1.1}
.nb-sub{font-size:11px;color:var(--ink3);letter-spacing:.02em}
.nb-sp{flex:1}
.nb-badge{background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500}
/* sidebar */
.sb{width:248px;background:transparent;padding:28px 16px 28px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.nsl{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.14em;padding:8px 14px 6px;margin-top:8px}
.ni{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;color:var(--ink2);font-size:14px;font-weight:500;transition:all .25s var(--ease);border:1px solid transparent;background:none;width:100%;text-align:left;font-family:inherit}
.ni:hover{background:rgba(255,255,255,.8);color:var(--ink);transform:translateX(3px)}
.ni.active{background:var(--surface);color:var(--brand);font-weight:700;border-color:var(--line);box-shadow:var(--sh)}
.sb>div[style*="padding:12px"]{background:rgba(15,118,110,.06)!important;border:1px dashed rgba(15,118,110,.25)!important;border-radius:14px!important}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
.card:hover{border-color:var(--line2);box-shadow:var(--shl)}
.card-sm{padding:18px;border-radius:16px}
.card-glow{border-color:rgba(15,118,110,.35)!important;box-shadow:0 0 0 4px rgba(15,118,110,.07),var(--shl)!important}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s var(--ease);border:1px solid transparent;font-family:inherit;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bp{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 18px -6px rgba(15,118,110,.55)}
.bp:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(15,118,110,.6)}
.bt{background:linear-gradient(135deg,var(--sea),#3a97c0);color:#fff;box-shadow:0 8px 18px -6px rgba(43,127,168,.5)}
.bt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(43,127,168,.55)}
.bd{background:linear-gradient(135deg,#d9453d,#e8664a);color:#fff;box-shadow:0 8px 18px -6px rgba(217,69,61,.45)}
.bd:hover:not(:disabled){transform:translateY(-2px)}
.bo{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.bo:hover:not(:disabled){background:var(--surface);border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.bg{background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.bg:hover:not(:disabled){background:var(--surface2);color:var(--ink);border-color:var(--line2)}
.blg{padding:16px 32px;font-size:16px}
.bsm{padding:9px 18px;font-size:13px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700}
.bl{background:rgba(47,138,82,.12);color:var(--ok);border:1px solid rgba(47,138,82,.28)}
.bm{background:rgba(185,120,0,.12);color:var(--warn);border:1px solid rgba(185,120,0,.28)}
.bh{background:rgba(217,69,61,.1);color:var(--bad);border:1px solid rgba(217,69,61,.28)}
.bb{background:rgba(15,118,110,.1);color:var(--brand);border:1px solid rgba(15,118,110,.25)}
.bla{background:rgba(212,81,45,.1);color:var(--coral);border:1px solid rgba(212,81,45,.25)}
/* type */
.pt{font-size:34px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.15}
.ps{color:var(--ink2);font-size:15.5px;margin-bottom:32px;max-width:640px}
.st{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
/* stepper */
.stepper{display:flex;align-items:center;margin-bottom:36px;padding:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh)}
.sc2{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;transition:all .3s}
.sc2.done{background:var(--brand);color:#fff}
.sc2.active{background:var(--coral);color:#fff;box-shadow:0 0 0 5px rgba(212,81,45,.16)}
.sc2.pending{background:var(--surface2);color:var(--ink3);border:1.5px solid var(--line2)}
.sl2{font-size:12.5px;font-weight:600}
.sl2.active{color:var(--ink)}.sl2.done{color:var(--brand)}.sl2.pending{color:var(--ink3)}
.step-line{flex:1;height:2px;background:var(--line);margin:0 10px;border-radius:2px}
.step-line.done{background:var(--brand)}
.step{display:flex;align-items:center;gap:8px}
/* camera */
.cam-wrap{position:relative;border-radius:24px;overflow:hidden;background:#12201d;aspect-ratio:4/3;max-width:520px;margin:0 auto;border:4px solid var(--surface);box-shadow:var(--shl)}
.cam-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(245,241,234,.94)}
.cc{position:absolute;width:26px;height:26px;border-color:#7fe0d4;border-style:solid;opacity:.9;border-radius:3px}
.cc.tl{top:14px;left:14px;border-width:3px 0 0 3px}
.cc.tr{top:14px;right:14px;border-width:3px 3px 0 0}
.cc.bl{bottom:14px;left:14px;border-width:0 0 3px 3px}
.cc.br{bottom:14px;right:14px;border-width:0 3px 3px 0}
.fsr{position:absolute;width:140px;height:180px;border:2px dashed rgba(127,224,212,.6);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);animation:sp 2s ease-in-out infinite}
@keyframes sp{0%,100%{border-color:rgba(127,224,212,.35);transform:translate(-50%,-50%) scale(1)}50%{border-color:rgba(127,224,212,.85);transform:translate(-50%,-50%) scale(1.03)}}
.sln{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,transparent,#7fe0d4,transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation:sm 2.5s ease-in-out infinite}
@keyframes sm{0%{top:calc(50% - 60px);opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(50% + 60px);opacity:0}}
.csb{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(18,32,29,.88));padding:22px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.cam-wrap .csb span{color:#e6f1ed!important}.cam-wrap #ctm{color:#7fe0d4!important}
.rd{width:8px;height:8px;border-radius:50%;background:#7fe0d4;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
/* slider + options */
.ss{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;background:linear-gradient(90deg,rgba(47,138,82,.35),rgba(185,120,0,.35),rgba(217,69,61,.4));outline:none}
.ss::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--brand);cursor:pointer;box-shadow:0 4px 10px rgba(15,118,110,.4);transition:transform .25s var(--ease)}
.ss::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:6px solid var(--brand);cursor:pointer;box-shadow:0 4px 10px rgba(15,118,110,.4)}
.ss::-webkit-slider-thumb:hover{transform:scale(1.15)}
.oc{padding:18px;border-radius:16px;border:1.5px solid var(--line);cursor:pointer;transition:all .25s var(--ease);background:var(--surface2);text-align:center}
.oc:hover{border-color:rgba(15,118,110,.45);background:var(--surface);transform:translateY(-3px);box-shadow:var(--sh)}
.oc.sel{border-color:var(--brand);background:rgba(15,118,110,.07);box-shadow:0 0 0 4px rgba(15,118,110,.1)}
.oc.selt{border-color:var(--sea)!important;background:rgba(43,127,168,.07);box-shadow:0 0 0 4px rgba(43,127,168,.1)}
.emoj-wrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.emo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;border-radius:18px;cursor:pointer;transition:all .25s var(--ease);border:1.5px solid var(--line);background:var(--surface2);font-size:28px}
.emo:hover{transform:translateY(-4px) scale(1.05);border-color:rgba(212,81,45,.45);background:var(--surface)}
.emo.sel{border-color:var(--coral);background:rgba(212,81,45,.08);transform:scale(1.08);box-shadow:0 0 0 4px rgba(212,81,45,.12)}
.emo-lbl{font-size:11px;color:var(--ink2);font-weight:600}
/* score */
.sc3{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;border:4px solid}
.sc3.low{border-color:var(--ok);background:rgba(47,138,82,.08);box-shadow:0 0 0 8px rgba(47,138,82,.08)}
.sc3.moderate{border-color:var(--warn);background:rgba(185,120,0,.08);box-shadow:0 0 0 8px rgba(185,120,0,.08)}
.sc3.high{border-color:var(--bad);background:rgba(217,69,61,.07);box-shadow:0 0 0 8px rgba(217,69,61,.08)}
.sn{font-family:'Fraunces',serif;font-size:46px;font-weight:700;line-height:1}
.pbc{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.pbf{height:100%;border-radius:999px;transition:width .8s var(--ease)}
/* breathing */
.br-wrap{display:flex;flex-direction:column;align-items:center;gap:32px;padding:40px}
.br-ro{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.br-ring{position:absolute;border-radius:50%;transition:transform .1s}
.br-r1{width:260px;height:260px;background:rgba(43,127,168,.07);border:1px solid rgba(43,127,168,.22)}
.br-r2{width:200px;height:200px;background:rgba(15,118,110,.08);border:1px solid rgba(15,118,110,.25)}
.br-core{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#2b7fa8,#0f766e);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .1s ease;box-shadow:0 0 30px rgba(15,118,110,.4)}
.br-ph{font-family:'Fraunces',serif;font-size:28px;font-weight:700;text-align:center;min-height:38px;color:var(--brand)}
.br-tm{font-size:52px;font-family:'Fraunces',serif;font-weight:700;color:var(--ink);min-width:60px;text-align:center;line-height:1}
.br-cy{font-size:14px;color:var(--ink2);font-weight:500}
/* recs + timeline */
.rc{display:flex;align-items:flex-start;gap:14px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:all .25s var(--ease);box-shadow:var(--sh)}
.rc:hover{border-color:rgba(15,118,110,.35);transform:translateX(4px)}
.ri{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line2);border-radius:2px}
.tli{position:relative;margin-bottom:14px}
.tli .card-sm{transition:all .25s var(--ease)}
.tli .card-sm:hover{transform:translateX(4px)}
.tld{position:absolute;left:-26px;top:16px;width:16px;height:16px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px}
.tld.low{background:var(--ok);box-shadow:0 0 0 2px rgba(47,138,82,.4)}
.tld.moderate{background:var(--warn);box-shadow:0 0 0 2px rgba(185,120,0,.4)}
.tld.high{background:var(--bad);box-shadow:0 0 0 2px rgba(217,69,61,.4)}
/* hero */
.hero{position:relative;border-radius:32px;padding:48px;background:linear-gradient(135deg,#dcefe9 0%,#f6efe3 55%,#fbe3d8 100%);border:1px solid rgba(15,118,110,.15);overflow:hidden;margin-bottom:28px;box-shadow:var(--shl)}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;pointer-events:none}
.o1{width:300px;height:300px;background:#f4a58f;top:-100px;right:-60px}
.o2{width:220px;height:220px;background:#7fd1c4;bottom:-80px;left:-40px}
.hg{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:rgba(255,255,255,.7);padding:6px 14px;border-radius:999px;letter-spacing:.06em;margin-bottom:16px}
.ht{font-size:44px;font-weight:700;color:var(--ink);line-height:1.1;margin-bottom:14px}
.hd{color:var(--ink2);font-size:16px;line-height:1.65;max-width:500px;margin-bottom:28px}
.sc4{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--sh);transition:all .3s var(--ease)}
.sc4:hover{transform:translateY(-4px);box-shadow:var(--shl)}
.si{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sv{font-family:'Fraunces',serif;font-size:30px;font-weight:700;line-height:1;margin-bottom:3px}
.slb{font-size:12.5px;color:var(--ink2);font-weight:500}
.pn{background:rgba(15,118,110,.05);border:1px solid rgba(15,118,110,.16);border-radius:16px;padding:18px;margin-bottom:20px}
.pi{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink2);margin-bottom:9px;line-height:1.55}
.pi:last-child{margin-bottom:0}
/* modal + toast */
.mo{position:fixed;inset:0;background:rgba(29,43,40,.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:32px;max-width:480px;width:100%;animation:su .25s ease}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tc{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#f5f1ea;border-radius:16px;padding:13px 18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;box-shadow:var(--shl);animation:sir .35s var(--ease);min-width:220px}
@keyframes sir{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
.dv{height:1px;background:var(--line);margin:24px 0}
/* utilities */
.flex{display:flex}.fc{flex-direction:column}.ic{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}.mb32{margin-bottom:32px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.tsm{font-size:13px}.txs{font-size:11px}.tm{color:var(--ink3)}.ts{color:var(--ink2)}.tab{color:var(--brand)}.tat{color:var(--sea)}.tag{color:var(--ok)}.tay{color:var(--warn)}.tad{color:var(--bad)}
.fw{width:100%}.tc2{text-align:center}
/* alerts + banners */
.ab{border-radius:16px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.55;margin-bottom:16px}
.ai{background:rgba(15,118,110,.07);border:1px solid rgba(15,118,110,.2);color:#0b5c56}
.aw{background:rgba(185,120,0,.09);border:1px solid rgba(185,120,0,.25);color:#8a5a00}
.as{background:rgba(212,81,45,.08);border:1px solid rgba(212,81,45,.22);color:#a8381a}
.tip-card{background:linear-gradient(135deg,rgba(43,127,168,.10),rgba(15,118,110,.08));border:1px solid rgba(43,127,168,.22);border-radius:20px;padding:22px;display:flex;align-items:flex-start;gap:16px}
.sb-banner{background:linear-gradient(135deg,rgba(212,81,45,.09),rgba(217,70,122,.08));border:1px solid rgba(212,81,45,.25);border-radius:22px;padding:24px;text-align:center}
.qb{margin-bottom:32px}
.ql{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.qn{width:28px;height:28px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.svd{text-align:center;font-family:'Fraunces',serif;font-size:48px;font-weight:700;margin:12px 0 10px;line-height:1}
.sll{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:8px}
.frl{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid}
.chart-c{position:relative;height:230px;width:100%}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(29,43,40,.18);border-radius:4px}
.fi{animation:fi .5s var(--ease)}
.spinner{width:32px;height:32px;border:3px solid rgba(15,118,110,.18);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* mobile nav */
.mn{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);border-top:1px solid var(--line);padding:8px 0 16px;z-index:100;backdrop-filter:blur(14px)}
.mni{display:flex;justify-content:space-around}
.mnb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;cursor:pointer;border:none;background:none;color:var(--ink3);font-size:11px;font-weight:600;transition:all .25s;font-family:inherit}
.mnb.active{color:var(--brand)}

<body>
<div id="app"></div>
<div class="tc" id="tc"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// =====================================================================
// StressSense AI — Complete Self-Contained Application
// =====================================================================

// ── State ─────────────────────────────────────────────────────────────
const State = {
  page: 'home',
  data: {},
  checkin: { step: 0, useCamera: null, faceResult: null, q: { stress:5, sleep:2, workload:1, emotion:2 } }
};

// ── Router ────────────────────────────────────────────────────────────
function nav(page, data = {}) {
  State.page = page; State.data = data;
  stopCamera();
  clearInterval(breathTimer);
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// ── Render ────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${navbar()}
    <div class="ml">
      <aside class="sb">${sidebar()}</aside>
      <main class="pc" id="pc"></main>
    </div>
    <nav class="mn" id="mn">${mobileNav()}</nav>`;

  const pc = document.getElementById('pc');
  const p = State.page;
  if      (p==='home')      { pc.innerHTML = homePage();      homeListeners(); }
  else if (p==='checkin')   { checkinPage(pc); }
  else if (p==='results')   { pc.innerHTML = resultsPage(State.data); resultsListeners(); }
  else if (p==='breathing') { pc.innerHTML = breathingPage(); breathListeners(); }
  else if (p==='history')   { pc.innerHTML = historyPage();   historyListeners(); requestAnimationFrame(initCharts); }

  document.querySelectorAll('[data-nav]').forEach(el =>
    el.addEventListener('click', () => nav(el.dataset.nav)));
}

// ── Navbar ────────────────────────────────────────────────────────────
function navbar() {
  const t = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  return `<nav class="nb">
    <div class="nb-brand" data-nav="home">
      <div class="nb-logo">🧠</div>
      <div><div class="nb-title">StressSense AI</div><div class="nb-sub">Student Wellness Check-In</div></div>
    </div>
    <div class="nb-sp"></div>
    <span class="nb-badge">🕐 ${t}</span>
    <span class="nb-badge" style="color:#2b7fa8;border-color:rgba(43,127,168,.3);background:rgba(43,127,168,.1)">🔒 Privacy First</span>
  </nav>`;
}

const NAV_ITEMS = [{id:'home',icon:'🏠',label:'Dashboard'},{id:'checkin',icon:'✅',label:'Check-In'},{id:'breathing',icon:'🌬️',label:'Breathing'},{id:'history',icon:'📈',label:'History'}];

function sidebar() {
  return `<div class="nsl">Navigation</div>
  ${NAV_ITEMS.map(n=>`<button class="ni ${State.page===n.id?'active':''}" data-nav="${n.id}">${n.icon} ${n.label}</button>`).join('')}
  <div class="nsl" style="margin-top:24px">About</div>
  <div style="padding:12px;font-size:12px;color:#7b8985;line-height:1.6;border-radius:8px;background:rgba(15,118,110,.05);border:1px solid rgba(15,118,110,.15)">
    🔒 All data stays on your device.<br><br>⚕️ Not a medical tool.
  </div>`;
}

function mobileNav() {
  return `<div class="mni">${NAV_ITEMS.map(n=>`<button class="mnb ${State.page===n.id?'active':''}" data-nav="${n.id}"><span style="font-size:20px">${n.icon}</span>${n.label}</button>`).join('')}</div>`;
}

// ── localStorage Helpers ──────────────────────────────────────────────
const SK = 'ssi_history';
function getHistory() { try { return JSON.parse(localStorage.getItem(SK)||'[]'); } catch{return[];} }
function saveCheckin(d) {
  const h = getHistory();
  h.unshift({id:Date.now(),timestamp:new Date().toISOString(),...d});
  localStorage.setItem(SK, JSON.stringify(h.slice(0,50)));
}
function clearHistory() { localStorage.removeItem(SK); }

// Seed sample data
(function seedData(){
  if(!getHistory().length){
    const now = Date.now();
    const s = [
      {score:58,category:'moderate',stress:6,faceLabel:'Neutral',faceEmoji:'😐',sleep:1,workload:2,emotion:2},
      {score:24,category:'low',stress:3,faceLabel:'Positive / Relaxed',faceEmoji:'😊',sleep:3,workload:1,emotion:4},
      {score:72,category:'high',stress:8,faceLabel:'Tense-Looking',faceEmoji:'😟',sleep:0,workload:3,emotion:1},
      {score:45,category:'moderate',stress:5,faceLabel:'Tired-Looking',faceEmoji:'😴',sleep:1,workload:2,emotion:2},
      {score:30,category:'low',stress:4,faceLabel:'Neutral',faceEmoji:'😐',sleep:2,workload:1,emotion:3},
      {score:65,category:'moderate',stress:7,faceLabel:'Tense-Looking',faceEmoji:'😟',sleep:0,workload:2,emotion:1},
      {score:18,category:'low',stress:2,faceLabel:'Positive / Relaxed',faceEmoji:'😊',sleep:3,workload:0,emotion:4},
    ];
    localStorage.setItem(SK, JSON.stringify(s.map((d,i)=>({id:1000+i,timestamp:new Date(now-(i+1)*86400000).toISOString(),...d}))));
  }
})();

// ── Scoring ───────────────────────────────────────────────────────────
function getScore(q) {
  const sp = ((q.stress-1)/9)*40;
  const sl = [20,10,5,0][q.sleep]??10;
  const wl = [0,10,20,30][q.workload]??10;
  const em = [10,7,4,1,0][q.emotion]??5;
  return Math.round(Math.min(100, sp+sl+wl+em));
}
function getCat(score) { return score<=30?'low':score<=60?'moderate':'high'; }

// ── Face Label ────────────────────────────────────────────────────────
function getFaceLabel(bs) {
  if(!bs||!bs.length) return null;
  const m={};
  bs.forEach(s=>m[s.categoryName]=s.score);
  const brow=((m.browInnerUp||0)+(m.browDownLeft||0)+(m.browDownRight||0))/3;
  const esq=((m.eyeSquintLeft||0)+(m.eyeSquintRight||0))/2;
  const smile=((m.mouthSmileLeft||0)+(m.mouthSmileRight||0))/2;
  const frown=((m.mouthFrownLeft||0)+(m.mouthFrownRight||0))/2;
  const jaw=m.jawOpen||0;
  const csq=((m.cheekSquintLeft||0)+(m.cheekSquintRight||0))/2;
  if(smile>0.35||csq>0.4) return {label:'Positive / Relaxed',emoji:'😊',color:'#2f8a52'};
  if(brow>0.25&&frown>0.15) return {label:'Tense-Looking',emoji:'😟',color:'#b97800'};
  if(esq>0.3) return {label:'Tired-Looking',emoji:'😴',color:'#d4512d'};
  if(jaw>0.3) return {label:'Surprised / Alert',emoji:'😮',color:'#0f766e'};
  return {label:'Neutral',emoji:'😐',color:'#53625e'};
}

// ── Recommendations ───────────────────────────────────────────────────
const ALL_RECS = [
  {id:1,icon:'🌬️',title:'Guided Breathing',desc:'Try the 4-7-8 breathing exercise to quickly calm your nervous system.',action:'breathing',bg:'rgba(43,127,168,.12)'},
  {id:2,icon:'🚶',title:'Short Walk Break',desc:'A 5-minute walk between study sessions boosts focus and reduces tension.',bg:'rgba(15,118,110,.12)'},
  {id:3,icon:'🧘',title:'Body Stretch',desc:'Stand up and do gentle stretches — neck rolls, shoulder shrugs, forward bends.',bg:'rgba(212,81,45,.12)'},
  {id:4,icon:'😴',title:'Improve Sleep Hygiene',desc:'Aim for 7–9 hours. Set a consistent bedtime and avoid screens 30 min before sleep.',bg:'rgba(217,70,122,.12)'},
  {id:5,icon:'📅',title:'Study Planning',desc:'Break tasks into small chunks using the Pomodoro technique (25 min work + 5 min break).',bg:'rgba(185,120,0,.12)'},
  {id:6,icon:'💧',title:'Hydrate & Snack',desc:'Drink water and have a light snack to maintain energy levels.',bg:'rgba(47,138,82,.12)'},
  {id:7,icon:'🗣️',title:'Talk to Someone',desc:'Share how you\'re feeling with a trusted friend, mentor, or counselor.',bg:'rgba(212,81,45,.12)',highlight:true},
  {id:8,icon:'📓',title:'Journaling',desc:'Write down what\'s on your mind for 5 minutes — it helps process emotions.',bg:'rgba(15,118,110,.12)'},
  {id:9,icon:'🌿',title:'Take a Real Break',desc:'Step away completely from screens and assignments for at least 15 minutes.',bg:'rgba(47,138,82,.12)'},
];
function getRecs(score, q) {
  const r=[ALL_RECS[0]];
  if(q){
    if(q.sleep<=1) r.push(ALL_RECS[3]);
    if(q.workload>=2) r.push(ALL_RECS[4]);
    if(q.emotion<=1) r.push(ALL_RECS[6]);
    if(q.stress>=7) r.push(ALL_RECS[8]);
  }
  if(score>=50) r.push(ALL_RECS[2]);
  r.push(ALL_RECS[1]); r.push(ALL_RECS[5]);
  const seen=new Set();
  return r.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true;}).slice(0,5);
}

// ── Toast ─────────────────────────────────────────────────────────────
function toast(msg, icon='ℹ️') {
  const c=document.getElementById('tc');
  if(!c) return;
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<span>${icon}</span><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

// ── Helpers ───────────────────────────────────────────────────────────
function cap(s){return s?s[0].toUpperCase()+s.slice(1):'';}
function relTime(iso){
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<120) return 'just now';
  if(d<3600) return Math.round(d/60)+'m ago';
  if(d<86400) return Math.round(d/3600)+'h ago';
  return Math.round(d/86400)+'d ago';
}
function fmtDate(iso){return new Date(iso).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function fmtShort(iso){return new Date(iso).toLocaleDateString([],{month:'short',day:'numeric'});}
function catColor(c){return c==='low'?'#2f8a52':c==='high'?'#d9453d':'#b97800';}
function stressCol(v){return v<=3?'#2f8a52':v<=6?'#b97800':'#d9453d';}
function stressLbl(v){return v<=3?'🟢 Low Stress':v<=6?'🟡 Moderate Stress':'🔴 High Stress';}

const SLEEP_L=['Poor (< 5 hrs)','Fair (5–6 hrs)','Good (7–8 hrs)','Great (8+ hrs)'];
const WORK_L=['Light','Moderate','Heavy','Overwhelming'];
const EMO_L=['Awful 😭','Bad 😔','Okay 😐','Good 🙂','Great 😄'];
const TIPS=[
  {icon:'🌅',tip:'Start your morning with 5 minutes of deep breathing to set a calm tone for the day.'},
  {icon:'💧',tip:'Drink a glass of water before every study session — hydration boosts focus by up to 20%.'},
  {icon:'🚶',tip:'A brisk 10-minute walk between classes improves mood and reduces cortisol levels.'},
  {icon:'📱',tip:'Try a digital sunset — put your phone away 30 minutes before bed for better sleep.'},
  {icon:'🧘',tip:'Even 3 minutes of mindfulness meditation can measurably lower your stress response.'},
  {icon:'📓',tip:'Write down 3 things you\'re grateful for tonight. Gratitude journaling rewires your brain.'},
  {icon:'🎵',tip:'Lo-fi music or nature sounds while studying can reduce anxiety and improve concentration.'},
];

// ── Home Page ─────────────────────────────────────────────────────────
function homePage() {
  const h=getHistory(), last=h[0];
  const tot=h.length;
  const r7=h.slice(0,7);
  const avg=r7.length?Math.round(r7.reduce((a,b)=>a+(b.score||0),0)/r7.length):null;
  const pos=h.filter(x=>x.category==='low').length;
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning':hour<17?'Good afternoon':hour<21?'Good evening':'Good night';
  const tip=TIPS[new Date().getDay()%TIPS.length];
  // streak
  let streak=0;
  const dates=[...new Set(h.map(x=>new Date(x.timestamp).toDateString()))];
  const chk=new Date();
  for(let i=0;i<30;i++){if(dates.includes(chk.toDateString())){streak++;chk.setDate(chk.getDate()-1);}else break;}

  const lastCard=last?`
    <div class="card card-sm flex ic g16" style="border-color:${catColor(last.category)}22">
      <div style="font-size:36px">${last.faceEmoji||'😐'}</div>
      <div style="flex:1">
        <div style="font-size:12px;color:#7b8985;margin-bottom:2px">Last check-in · ${relTime(last.timestamp)}</div>
        <div style="font-size:15px;font-weight:600">Stress: ${last.stress||'?'}/10</div>
        <div style="font-size:13px;color:#53625e">${last.faceLabel||'No face data'} · <span style="color:${catColor(last.category)}">${cap(last.category)} stress</span></div>
      </div>
      <span class="badge b${last.category[0]}">${cap(last.category)}</span>
    </div>`:
    `<div class="card card-sm tc2" style="padding:24px">
      <div style="font-size:32px;margin-bottom:8px">👋</div>
      <div style="font-weight:600;margin-bottom:4px">No check-ins yet</div>
      <div style="font-size:13px;color:#7b8985">Start your first check-in today!</div>
    </div>`;

  return `<div class="fi">
    <div class="hero">
      <div class="orb o1"></div><div class="orb o2"></div>
      <div style="position:relative;z-index:1">
        <div class="hg">${greet} 👋</div>
        <h1 class="ht">How are you feeling<br>today?</h1>
        <p class="hd">Take a 2-minute wellness check-in to reflect on your stress levels and discover personalized relaxation strategies. Your data stays private on your device.</p>
        <div class="flex g12" style="flex-wrap:wrap">
          <button class="btn bp blg" id="btn-start">✅ Start Today's Check-In</button>
          <button class="btn bo" id="btn-breath">🌬️ Breathing Exercise</button>
        </div>
      </div>
    </div>

    <div class="ab ai mb24">
      <span>💡</span>
      <span><strong>Wellness Reminder:</strong> This tool is for personal reflection only — not a medical diagnostic. If experiencing persistent distress, please reach out to a counselor or trusted adult.</span>
    </div>

    <div class="g4 sg mb24">
      ${[['📊','rgba(15,118,110,.15)',tot,'tab','Total Check-Ins'],
         ['📅','rgba(43,127,168,.15)',streak,'tat','Day Streak'],
         ['📉','rgba(185,120,0,.15)',avg!==null?avg:'—','tay','7-Day Avg Score'],
         ['🧘','rgba(212,81,45,.15)',pos,'','Positive Days']].map(([ic,bg,val,cl,lb])=>`
        <div class="sc4"><div class="si" style="background:${bg}">${ic}</div><div><div class="sv ${cl}">${val}</div><div class="slb">${lb}</div></div></div>`).join('')}
    </div>

    <div class="g2 mb24">
      <div>
        <div class="st">📋 Latest Check-In</div>
        ${lastCard}
        <button class="btn bg bsm mt16 fw" id="btn-hist">📈 View Full History</button>
      </div>
      <div>
        <div class="st">💡 Today's Wellness Tip</div>
        <div class="tip-card">
          <span style="font-size:32px">${tip.icon}</span>
          <div style="font-size:14px;line-height:1.65">${tip.tip}</div>
        </div>
        <div class="dv"></div>
        <div class="st">🧘 Quick Breathing Reset</div>
        <div class="card card-sm" style="background:linear-gradient(135deg,rgba(43,127,168,.1),rgba(15,118,110,.08));border-color:rgba(43,127,168,.2)">
          <div class="flex ic g12 mb12">
            <span style="font-size:28px">🌬️</span>
            <div><div style="font-weight:600;font-size:14px">4-7-8 Breathing</div><div style="font-size:12px;color:#7b8985">~4 minutes · Reduces anxiety fast</div></div>
          </div>
          <button class="btn bt bsm fw" id="btn-breath2">Start Now →</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="st">🔒 Privacy & Safety</div>
      <div class="g2" style="gap:12px">
        ${[['🎥','Camera permission only on your request — never automatic.'],
           ['🚫','No webcam images or video are ever stored.'],
           ['💻','All facial analysis runs locally in your browser.'],
           ['🗑️','You can delete your check-in history at any time.'],
           ['⚕️','This is a wellness reflection tool, not a medical diagnostic.'],
           ['🔐','Data stored only in your browser — never sent to any server.']].map(([i,t])=>`
          <div class="pi"><span style="font-size:16px">${i}</span><span style="font-size:13px;color:#53625e">${t}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}
function homeListeners() {
  document.getElementById('btn-start')?.addEventListener('click',()=>nav('checkin'));
  document.getElementById('btn-breath')?.addEventListener('click',()=>nav('breathing'));
  document.getElementById('btn-breath2')?.addEventListener('click',()=>nav('breathing'));
  document.getElementById('btn-hist')?.addEventListener('click',()=>nav('history'));
}

// ── Check-In Page ─────────────────────────────────────────────────────
let ciStep=0, ciCamera=null, ciFace=null, ciQ={stress:5,sleep:2,workload:1,emotion:2};
let mediaStream=null, faceReadings=[], analyzing=false, faceLandmarker=null;

function stopCamera(){
  analyzing=false;
  if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
}

function checkinPage(pc) {
  ciStep=0; ciCamera=null; ciFace=null; ciQ={stress:5,sleep:2,workload:1,emotion:2};
  faceReadings=[]; analyzing=false;
  renderCIStep(pc);
}

function stepperHTML(cur) {
  const steps=['Privacy','Camera','Questions','Done'];
  return `<div class="stepper mb32">
    ${steps.map((l,i)=>`
      ${i>0?`<div class="step-line ${i<=cur?'done':''}"></div>`:''}
      <div class="step">
        <div class="sc2 ${i<cur?'done':i===cur?'active':'pending'}">${i<cur?'✓':i+1}</div>
        <span class="sl2 ${i<cur?'done':i===cur?'active':'pending'}">${l}</span>
      </div>`).join('')}
  </div>`;
}

function renderCIStep(pc) {
  if(ciStep===0) { pc.innerHTML=ciPrivacy(); ciPrivacyL(pc); }
  else if(ciStep===1 && ciCamera===false) { ciStep=2; renderCIStep(pc); }
  else if(ciStep===1) { pc.innerHTML=ciCamHTML(); ciCamL(pc); }
  else if(ciStep===2) { pc.innerHTML=ciQHTML(); ciQL(pc); }
}

function ciPrivacy() {
  return `<div class="fi">
    <h1 class="pt">🧠 Wellness Check-In</h1>
    <p class="ps">A quick 2-minute reflection on how you're feeling today.</p>
    ${stepperHTML(0)}
    <div class="card mb20">
      <h2 class="st">🔒 Privacy Notice</h2>
      <div class="pn">
        ${[['🎥','<strong>Camera is optional.</strong> You can skip it and still complete the check-in.'],
           ['🚫','<strong>No images are stored.</strong> Facial analysis is processed live and immediately discarded.'],
           ['💻','<strong>Everything stays on your device.</strong> No data is sent to any server.'],
           ['⚕️','<strong>Not a medical tool.</strong> Facial expressions do not diagnose stress or any condition.'],
           ['🗑️','<strong>You control your data.</strong> Delete history anytime from the History page.'],
           ['👤','<strong>No surveillance.</strong> This tool is for personal reflection only.']].map(([i,t])=>`
          <div class="pi"><span style="font-size:16px">${i}</span><span>${t}</span></div>`).join('')}
      </div>
      <h2 class="st" style="margin-top:24px">Choose your check-in type:</h2>
      <div class="g2">
        <div class="oc" id="opt-cam" tabindex="0" role="button">
          <div style="font-size:40px;margin-bottom:10px">📸</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:6px">Camera Check-In</div>
          <div style="font-size:12px;color:#7b8985;line-height:1.5">Uses your webcam to observe facial expression patterns as an optional wellness indicator.</div>
          <div class="badge bb mt8">Experimental 🔬</div>
        </div>
        <div class="oc" id="opt-nocam" tabindex="0" role="button">
          <div style="font-size:40px;margin-bottom:10px">📝</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:6px">Questionnaire Only</div>
          <div style="font-size:12px;color:#7b8985;line-height:1.5">Complete only the self-reported questionnaire. No camera required.</div>
          <div class="badge bla mt8">Privacy Friendly 🔒</div>
        </div>
      </div>
    </div>
    <div class="flex jb ic">
      <button class="btn bg" id="ci-back0">← Dashboard</button>
      <button class="btn bp" id="ci-next0" disabled>Continue →</button>
    </div>
  </div>`;
}

function ciPrivacyL(pc) {
  let sel=null;
  const cam=pc.querySelector('#opt-cam'), nocam=pc.querySelector('#opt-nocam'), next=pc.querySelector('#ci-next0');
  function pick(c){ sel=c; ciCamera=c;
    cam.classList.toggle('selt',c===true); cam.style.borderColor=c===true?'#2b7fa8':'';
    nocam.classList.toggle('sel',c===false);
    next.disabled=false; }
  cam.addEventListener('click',()=>pick(true)); cam.addEventListener('keydown',e=>e.key==='Enter'&&pick(true));
  nocam.addEventListener('click',()=>pick(false)); nocam.addEventListener('keydown',e=>e.key==='Enter'&&pick(false));
  pc.querySelector('#ci-back0').addEventListener('click',()=>nav('home'));
  next.addEventListener('click',()=>{ if(sel===null)return; ciStep=1; renderCIStep(pc); });
}

function ciCamHTML() {
  return `<div class="fi">
    <h1 class="pt">📸 Facial Expression Check-In</h1>
    <p class="ps">We'll observe your facial expression for a few seconds. No image is saved.</p>
    ${stepperHTML(1)}
    <div class="ab aw mb20"><span>🔬</span><span><strong>Experimental:</strong> Facial landmark analysis observes visible expression patterns only — it does <em>not</em> diagnose stress or any medical condition. Your self-reported answers matter more.</span></div>
    <div class="g2" style="gap:24px;align-items:start">
      <div>
        <div class="cam-wrap" id="cam-wrap">
          <video id="cam-vid" class="cam-video" autoplay playsinline muted></video>

async function startCam(pc) {
  const vid=pc.querySelector('#cam-vid'), ov=pc.querySelector('#cam-ov');
  const enab=pc.querySelector('#btn-enab'), stop=pc.querySelector('#btn-stop');
  const next=pc.querySelector('#ci-next1'), csb=pc.querySelector('#csb');
  const cst=pc.querySelector('#cst'), ctm=pc.querySelector('#ctm');
  const faceRes=pc.querySelector('#face-res');
  const corners=['cc-tl','cc-tr','cc-bl','cc-br','fsr','sln'];

  try {
    mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    vid.srcObject=mediaStream; await vid.play();
    if(ov) ov.style.display='none';
    if(csb) csb.style.display='flex';
    corners.forEach(id=>{const el=pc.querySelector('#'+id);if(el)el.style.display='block';});
    if(stop) stop.disabled=false;
    if(enab){enab.disabled=true;enab.textContent='✅ Camera Active';}
    if(faceRes) faceRes.innerHTML=`<div style="text-align:center;padding:16px 0"><div class="spinner mb12"></div><div style="font-size:14px;color:#53625e">Loading MediaPipe model…</div></div>`;

    await initMP(vid, faceRes, cst, ctm, next);
  } catch(err) {
    if(ov){
      ov.style.display='flex';
      ov.innerHTML=`<div style="font-size:32px;margin-bottom:8px">❌</div>
        <div style="font-size:14px;color:#d9453d;text-align:center;padding:0 16px">${camErr(err)}</div>
        <button class="btn bg bsm" style="margin-top:12px" onclick="document.getElementById('btn-skip').click()">Skip Camera →</button>`;
    }
    if(enab){enab.disabled=false;enab.textContent='📷 Try Again';}
  }
}

function camErr(e){
  if(e.name==='NotAllowedError') return 'Camera permission denied. Allow access in browser settings or skip.';
  if(e.name==='NotFoundError') return 'No camera found on this device.';
  if(e.name==='NotReadableError') return 'Camera is in use by another app.';
  return 'Camera unavailable: '+e.message;
}

async function initMP(vid, faceRes, cst, ctm, next) {
  try {
    const {FaceLandmarker,FilesetResolver} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    if(cst) cst.textContent='Loading face model…';
    const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    faceLandmarker=await FaceLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},
      outputFaceBlendshapes:true,runningMode:'VIDEO',numFaces:1
    });
    if(cst) cst.textContent='Analyzing expression…';
    runFaceAnalysis(vid, faceRes, cst, ctm, next);
  } catch(e) {
    console.warn('MediaPipe failed:',e);
    if(faceRes) faceRes.innerHTML=`
      <div class="ab aw" style="margin:0 0 12px"><span>⚠️</span><span>Facial model couldn't load (needs internet). You can still complete the questionnaire.</span></div>
      <div style="text-align:center;padding:16px 0"><div style="font-size:40px;margin-bottom:8px">😐</div><div style="font-size:14px;color:#53625e">Expression analysis unavailable.</div></div>`;
    ciFace={label:'Analysis Unavailable',emoji:'❓',color:'#53625e'};
    setTimeout(()=>{ if(next) next.disabled=false; },2000);
  }
}

function runFaceAnalysis(vid, faceRes, cst, ctm, next) {
  faceReadings=[]; analyzing=true;
  let count=8, frames=0, lastT=-1;
  if(ctm) ctm.textContent=count+'s';
  const cd=setInterval(()=>{ count--; if(ctm) ctm.textContent=count+'s'; if(count<=0) clearInterval(cd); },1000);

  function frame(){
    if(!analyzing) return;
    try {
      if(vid.currentTime!==lastT && vid.readyState>=2){
        lastT=vid.currentTime;
        const res=faceLandmarker.detectForVideo(vid,performance.now());
        if(res.faceBlendshapes?.length){
          const bs=res.faceBlendshapes[0].categories;
          faceReadings.push(bs); frames++;
          if(frames%6===0) updateFaceRes(faceRes, bs, frames);
        } else if(frames>10 && faceRes) {
          faceRes.innerHTML=`<div class="ab aw" style="margin:0"><span>👤</span><span>No face detected. Please center your face in frame.</span></div>`;
        }
      }
    } catch(e){}
    if(analyzing) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(()=>{
    analyzing=false; clearInterval(cd);
    if(cst) cst.textContent='Analysis complete'; if(ctm) ctm.textContent='✅';
    if(faceReadings.length===0){
      ciFace={label:'Not Detected',emoji:'❓',color:'#53625e'};
      if(faceRes) faceRes.innerHTML=`<div class="ab aw" style="margin:0"><span>👤</span><span>No face detected. Your questionnaire answers will be used.</span></div>`;
    } else {
      const avg=avgBS(faceReadings);
      ciFace=getFaceLabel(avg)||{label:'Neutral',emoji:'😐',color:'#53625e'};
      if(faceRes) faceRes.innerHTML=`
        <div style="text-align:center;padding:8px 0 16px">
          <div style="font-size:52px;margin-bottom:10px">${ciFace.emoji}</div>
          <div class="frl" style="border-color:${ciFace.color};color:${ciFace.color};background:${ciFace.color}18;margin:0 auto;width:fit-content;font-size:15px;padding:10px 20px">${ciFace.label}</div>
          <div style="font-size:12px;color:#7b8985;margin-top:12px">Based on ${faceReadings.length} frames · Experimental only</div>
        </div>
        <div class="ab ai" style="margin-top:12px">
          <span>ℹ️</span><span>This is an <strong>experimental observation</strong> — not a stress diagnosis.</span>
        </div>`;
    }
    if(next) next.disabled=false;
  },8000);
}

function updateFaceRes(faceRes, bs, frames) {
  if(!faceRes) return;
  const r=getFaceLabel(bs); if(!r) return;
  faceRes.innerHTML=`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:48px;margin-bottom:8px">${r.emoji}</div>
      <div class="frl" style="border-color:${r.color};color:${r.color};background:${r.color}18;margin:0 auto;width:fit-content">${r.label}</div>
      <div style="font-size:12px;color:#7b8985;margin-top:12px">Live · ${frames} frames</div>
    </div>
    <div style="margin-top:12px">
      <div style="font-size:11px;color:#7b8985;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Top Blendshapes</div>
      ${bs.filter(b=>b.score>0.15).slice(0,4).map(b=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:11px;color:#7b8985;width:140px;flex-shrink:0">${b.categoryName}</span>
          <div class="pbc" style="flex:1"><div class="pbf" style="width:${Math.round(b.score*100)}%;background:#2b7fa8"></div></div>
          <span style="font-size:11px;color:#53625e;width:30px">${Math.round(b.score*100)}%</span>
        </div>`).join('')}
    </div>`;
}

function avgBS(readings) {
  const sums={},counts={};
  readings.forEach(f=>f.forEach(b=>{sums[b.categoryName]=(sums[b.categoryName]||0)+b.score;counts[b.categoryName]=(counts[b.categoryName]||0)+1;}));
  return Object.keys(sums).map(k=>({categoryName:k,score:sums[k]/counts[k]}));
}

             {ph:'Hold',d:'7 seconds',ic:'⏸️',c:'#d4512d',t:'Hold your breath completely. Keep your body relaxed.'},
             {ph:'Exhale',d:'8 seconds',ic:'⬇️',c:'#2b7fa8',t:'Exhale completely through your mouth, making a whoosh sound.'}].map(p=>`
            <div class="flex ic g16" style="padding:10px 0;border-bottom:1px solid rgba(15,118,110,.15)">

              <div><div style="font-weight:600;font-size:13px;color:${p.c}">${p.ph} — ${p.d}</div><div style="font-size:12px;color:#7b8985;margin-top:2px">${p.t}</div></div>

            <li>Complete 4 cycles for best effect</li>
          </ul>

          <div style="font-size:13px;color:#53625e;line-height:1.6">🌿 <strong style="color:#2f8a52">Benefits:</strong> Regular practice can reduce anxiety, improve sleep, lower heart rate, and build stress resilience over time.</div>
        </div>
      </div>
    </div>
  </div>`;
}

function breathListeners() {
  let ph=0,tick=0,cycle=0,running=false;
  const MAX=4;
  const g=id=>document.getElementById(id);

  function applyV(){
    const p=PHASES[ph];
    const prog=tick/p.dur;
    let scale=ph===0?1+prog*.6:ph===2?1.6-prog*.6:1.6;
    const core=g('br-core'),r1=g('br-r1'),r2=g('br-r2');
    if(core){core.style.transform=`scale(${scale})`;core.style.background=`radial-gradient(circle,${p.col}dd,${p.col}88)`;core.style.boxShadow=`0 0 ${Math.round(30*scale)}px ${p.col}88`;}
    if(r1) r1.style.transform=`scale(${.95+(scale-1)*.12})`;
    if(r2) r2.style.transform=`scale(${.88+(scale-1)*.18})`;
    const phEl=g('br-ph'); if(phEl) phEl.textContent=p.name;
    const tiEl=g('br-tm'); if(tiEl) tiEl.textContent=p.dur-tick;
  }

  function tick_fn(){
    if(!running) return;
    applyV(); tick++;
    if(tick>=PHASES[ph].dur){
      tick=0; ph=(ph+1)%PHASES.length;
      if(ph===0){
        cycle++; const cy=g('br-cy'); if(cy) cy.textContent=`Cycle ${cycle} / ${MAX}`;
        if(cycle>=MAX){
          running=false; clearInterval(breathTimer);
          const phEl=g('br-ph'); if(phEl) phEl.textContent='🎉 Well done!';
          const tiEl=g('br-tm'); if(tiEl) tiEl.textContent='';
          const core=g('br-core'); if(core){core.style.transform='scale(1)';core.style.background='linear-gradient(135deg,#2b7fa8,#0f766e)';core.innerHTML='<span style="font-size:24px">✅</span>';}
          const sb=g('br-start'); if(sb){sb.disabled=false;sb.textContent='▶ Again';}
          const pb=g('br-pause'); if(pb) pb.disabled=true;
          toast('Great job! 4 cycles complete 🎉','🌬️');
        }
      }
    }
  }

  function doStart(){running=true;clearInterval(breathTimer);breathTimer=setInterval(tick_fn,1000);g('br-start').disabled=true;g('br-pause').disabled=false;applyV();}
  function doPause(){running=false;clearInterval(breathTimer);const s=g('br-start');if(s){s.disabled=false;s.textContent='▶ Resume';}const p=g('br-pause');if(p)p.disabled=true;const ph2=g('br-ph');if(ph2)ph2.textContent='Paused ⏸';}
  function doReset(){
    running=false;clearInterval(breathTimer);ph=0;tick=0;cycle=0;
    const s=g('br-start');if(s){s.disabled=false;s.textContent='▶ Start';}
    const pb=g('br-pause');if(pb)pb.disabled=true;
    const phEl=g('br-ph');if(phEl)phEl.textContent='Ready';
    const tiEl=g('br-tm');if(tiEl)tiEl.textContent='4';
    const cy=g('br-cy');if(cy)cy.textContent='Cycle 0 / '+MAX;
    const core=g('br-core');if(core){core.style.transform='scale(1)';core.style.background='linear-gradient(135deg,#2b7fa8,#0f766e)';core.style.boxShadow='0 0 30px rgba(43,127,168,.5)';core.innerHTML='<span style="font-size:24px">🌬️</span>';}
    const r1=g('br-r1');if(r1)r1.style.transform='scale(1)';
    const r2=g('br-r2');if(r2)r2.style.transform='scale(1)';
  }

  g('br-start')?.addEventListener('click',doStart);
  g('br-pause')?.addEventListener('click',doPause);
  g('br-reset')?.addEventListener('click',doReset);
}

// ── History Page ──────────────────────────────────────────────────────
function historyPage() {
  const h=getHistory();
  if(!h.length) return `<div class="fi">
    <h1 class="pt">📈 Check-In History</h1><p class="ps">Your past wellness check-ins appear here.</p>
    <div class="card tc2" style="padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">📋</div>
      <h2 style="margin-bottom:8px">No history yet</h2>
      <p style="color:#53625e;margin-bottom:24px">Complete your first check-in to start tracking your wellness journey.</p>
      <button class="btn bp" data-nav="checkin">✅ Start Check-In</button>
    </div></div>`;

  const r7=h.slice(0,7).reverse();
  const avg=Math.round(r7.reduce((a,b)=>a+(b.score||0),0)/r7.length);

  return `<div class="fi">
    <h1 class="pt">📈 Check-In History</h1>
    <p class="ps">Your wellness journey over time. All data is stored locally on your device.</p>
    <div class="g4 sg mb24">
      ${[['📊','rgba(15,118,110,.15)',h.length,'tab','Total Check-Ins'],
         ['📉','rgba(185,120,0,.15)',avg,'tay','7-Day Avg Index'],
         ['🌱','rgba(47,138,82,.15)',low,'tag','Low-Stress Days'],
         ['⚡','rgba(217,69,61,.15)',high,'tad','High-Stress Days']].map(([ic,bg,v,cl,lb])=>`
        <div class="sc4"><div class="si" style="background:${bg}">${ic}</div><div><div class="sv ${cl}">${v}</div><div class="slb">${lb}</div></div></div>`).join('')}
    </div>
    <div class="g2 mb24">
      <div class="card"><div class="st">📈 7-Day Stress Trend</div><div class="chart-c"><canvas id="chart-trend"></canvas></div><div style="font-size:12px;color:#7b8985;margin-top:8px">Self-reported stress score (1–10) over last 7 check-ins.</div></div>
      <div class="card"><div class="st">🥧 Stress Distribution</div><div class="chart-c"><canvas id="chart-dist"></canvas></div><div style="font-size:12px;color:#7b8985;margin-top:8px">Breakdown of check-in categories across all sessions.</div></div>
    </div>
    <div class="card mb24">
      <div class="flex jb ic mb20">
        <div class="st" style="margin-bottom:0">🕒 Check-In Timeline</div>
        <div class="flex g8"><span class="badge bl">🟢 Low</span><span class="badge bm">🟡 Moderate</span><span class="badge bh">🔴 High</span></div>
      </div>
      <div class="tl">
        ${h.slice(0,20).map(item=>`
          <div class="tli">
            <div class="tld ${item.category||'moderate'}"></div>
            <div class="card card-sm" style="border-color:${catColor(item.category)}22">
              <div class="flex jb" style="align-items:flex-start">
                <div class="flex ic g12">
                  <span style="font-size:28px">${item.faceEmoji||'😐'}</span>
                  <div>
                    <div style="font-weight:600;font-size:14px">Stress: ${item.stress||'?'}/10 <span class="badge b${(item.category||'m')[0]}" style="margin-left:8px">${cap(item.category||'unknown')}</span></div>
                    <div style="font-size:12px;color:#7b8985;margin-top:2px">${item.faceLabel||'No face data'} · Sleep: ${SLEEP_L[item.sleep]||'?'} · Workload: ${WORK_L[item.workload]||'?'}</div>
                  </div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <div style="font-size:12px;color:#7b8985">${fmtDate(item.timestamp)}</div>
                  <div style="font-size:11px;color:#7b8985">${fmtTime(item.timestamp)}</div>
                </div>
              </div>
            </div>
          </div>`).join('')}
      </div>
      ${h.length>20?`<div style="text-align:center;padding:16px;color:#7b8985;font-size:13px">Showing 20 of ${h.length} check-ins</div>`:''}
    </div>
    <div class="card" style="border-color:rgba(217,69,61,.2)">
      <div class="st">🗑️ Manage Your Data</div>
      <p style="font-size:14px;color:#53625e;margin-bottom:16px;line-height:1.6">Your history is stored only in your browser's local storage. Deleting is <strong style="color:#d9453d">irreversible</strong>.</p>
      <button class="btn bd" id="del-hist">🗑️ Delete All History</button>
    </div>
  </div>`;
}

function historyListeners() {
  document.getElementById('del-hist')?.addEventListener('click',()=>{
    if(confirm('Delete all check-in history? This cannot be undone.')) {
      clearHistory(); toast('History cleared.','🗑️'); nav('history');
    }
  });
}

function initCharts() {
  if(typeof Chart==='undefined') return;
  const h=getHistory(); if(!h.length) return;
  const r7=h.slice(0,7).reverse();
  const labels=r7.map(x=>fmtShort(x.timestamp));
  const scores=r7.map(x=>x.stress||0);
  const tCtx=document.getElementById('chart-trend');
  if(tCtx) new Chart(tCtx,{type:'line',data:{labels,datasets:[{label:'Stress Level',data:scores,borderColor:'#0f766e',backgroundColor:'rgba(15,118,110,.1)',borderWidth:2.5,pointBackgroundColor:scores.map(s=>s<=3?'#2f8a52':s<=6?'#b97800':'#d9453d'),pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:6,tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#ffffff',borderColor:'rgba(15,118,110,.3)',borderWidth:1,titleColor:'#1d2b28',bodyColor:'#53625e',callbacks:{label:c=>`Stress: ${c.raw}/10 · ${c.raw<=3?'🟢 Low':c.raw<=6?'🟡 Moderate':'🔴 High'}`}}},scales:{x:{grid:{color:'rgba(15,118,110,.08)'},ticks:{color:'#7b8985',font:{size:11}}},y:{min:0,max:10,grid:{color:'rgba(15,118,110,.08)'},ticks:{color:'#7b8985',font:{size:11},stepSize:2}}}}});
  const cats={low:0,moderate:0,high:0};
  h.forEach(x=>{if(x.category)cats[x.category]++;});
  const dCtx=document.getElementById('chart-dist');
  if(dCtx&&(cats.low+cats.moderate+cats.high)>0) new Chart(dCtx,{type:'doughnut',data:{labels:['🟢 Low','🟡 Moderate','🔴 High'],datasets:[{data:[cats.low,cats.moderate,cats.high],backgroundColor:['rgba(47,138,82,.7)','rgba(185,120,0,.7)','rgba(217,69,61,.7)'],borderColor:['#fff','#fff','#fff'],borderWidth:3,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:'#53625e',padding:16,font:{size:12}}},tooltip:{backgroundColor:'#ffffff',borderColor:'rgba(15,118,110,.3)',borderWidth:1,titleColor:'#1d2b28',bodyColor:'#53625e'}}}});
}

// ── Boot ──────────────────────────────────────────────────────────────
render();
</script>
